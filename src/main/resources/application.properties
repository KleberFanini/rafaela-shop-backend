spring.datasource.url=jdbc:postgresql://localhost:5432/rafaela_shop_db
spring.datasource.username=postgres
spring.datasource.password=admin123
```[cite: 5]

O Spring Boot no Render tentou conectar em `localhost:5432`[cite: 5]. Nos servidores em nuvem do Render, o `localhost` não possui o banco PostgreSQL instalado, fazendo a conexão falhar de imediato e gerando o erro de dialeto do Hibernate.

Além disso, faltou a configuração para o Spring Boot adotar a porta injetada pelo Render (`server.port=${PORT:8080}`).

